<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTube - Premium YouTube Downloader</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo-browser.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="NexTube" class="logo-img" width="280" height="72">
            </div>
            <p>Download your favorite videos in premium quality instantly.</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="url-input" placeholder="Paste YouTube link here..." autocomplete="off">
                <button id="fetch-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>Fetching video details...</p>
            </div>

            <div class="video-card" id="video-card">
                <div class="thumbnail-container">
                    <img id="video-thumbnail" src="" alt="Video Thumbnail">
                    <span class="duration" id="video-duration">00:00</span>
                </div>
                <div class="video-info">
                    <h2 id="video-title">Video Title</h2>
                    <p class="uploader" id="video-uploader">Channel Name</p>
                    
                    <div class="format-selection">
                        <label for="format-select">Select Quality</label>
                        <select id="format-select">
                            <!-- Options will be populated here -->
                        </select>
                    </div>

                    <button id="download-btn" class="primary-btn">
                        <i class="fa-solid fa-download"></i> Download Video
                    </button>
                    <div class="download-progress" id="download-progress" style="display: none; flex-direction: column; align-items: stretch; gap: 10px;">
                        <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                            <div class="spinner-small" id="progress-spinner"></div>
                            <span id="progress-status-text">Starting download...</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" id="progress-bar"></div>
                        </div>
                        <div class="progress-text" id="progress-percent">0%</div>
                    </div>
                </div>
            </div>

            <div class="error-msg" id="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">An error occurred.</span>
            </div>

            <div class="history-container" id="history-container" style="display: none;">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Downloads</h3>
                <div id="history-list"></div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
